#
# U-Boot v2026.01 Kconfig delta for the `vm --firmware u-boot` QEMU
# payload (ADR 0013 open question 6).  lamadist-uboot-vm.inc merges it
# over qemu_arm64_defconfig AFTER the board fragment
# (lamadist-soquartz-efi.cfg), so the board fragment's policy applies in
# full and this file holds only what qemu_arm64 needs that the board
# does not.  Nothing here turns on a command, a boot method, or the
# EFI boot manager.  A QEMU result proves U-Boot's EFI code at the
# pinned tag, never the SoC: every check re-runs on the board .config.

# QEMU is the prior stage: it loads its generated device tree at the
# base of RAM (board/emulation/qemu-arm/qemu-arm.c board_fdt_blob_setup).
# ARCH_QEMU implies OF_HAS_PRIOR_STAGE (arch/arm/Kconfig:1100), which
# turns OF_OMIT_DTB on (dts/Kconfig:205), so U-Boot carries no device
# tree of its own; the board fragment's "OF_BOARD is not set" would
# leave it with none.  On the board OF_BOARD stays off.
CONFIG_OF_BOARD=y

# The board env pins mmc0 and RK3568 load addresses; the QEMU env pins
# the virtio disk the vm task attaches and addresses inside virt's RAM.
CONFIG_ENV_DEFAULT_ENV_TEXT_FILE="lamadist-qemu-arm64.env"

# qemu_arm64_defconfig turns the TPM on, and EFI_TCG2_PROTOCOL defaults
# on with it (lib/efi_loader/Kconfig:437).  The board has no TPM, so its
# LoadImage and ExitBootServices paths carry no TCG2 measurement or
# exit-boot-services hook; keep the QEMU paths the same.  The guest
# kernel still reaches swtpm through its own driver.
# CONFIG_EFI_TCG2_PROTOCOL is not set

# Secure Boot verifies the loaded image with the PKCS#7, X.509, and RSA
# parsers and SHA-256.  qemu_arm64_defconfig picks the MbedTLS versions
# and the ARMv8 Crypto Extension SHA code; the board resolves to the
# legacy parsers and the generic SHA code.  Pick the board's, so a
# tampered or unsigned image is refused (or not) by the same verifier
# the board runs (lib/mbedtls/Kconfig:3 choice; arch/arm/cpu/armv8/Kconfig).
CONFIG_LEGACY_HASHING_AND_CRYPTO=y
# CONFIG_ARMV8_CRYPTO is not set
