# SPDX-License-Identifier: GPL-2.0-only
#
# U-Boot v2026.01 Kconfig fragment for the SOQuartz leaf (ADR 0013
# decision 3).  U-Boot is the UEFI provider and boots one thing: the
# signed systemd-boot at EFI/BOOT/BOOTAA64.EFI, under Secure Boot.
# Every boot path Secure Boot does not cover is compiled out, never left
# to ARMv8 or Rockchip defaults.  Merged over soquartz-model-a-rk3566_
# defconfig by u-boot-configure.inc (merge_config.sh, then oldconfig).
#
# Option names were checked against the v2026.01 Kconfig.  The EFI boot
# method is BOOTMETH_EFILOADER (boot/Kconfig:626) and the ELF command is
# CMD_ELF; BOOTMETH_PXE is not a symbol (PXE is BOOTMETH_EXTLINUX_PXE).
#
# There is no U-Boot prompt: CMDLINE is off, which removes every command
# (cmd/Kconfig wraps them all in `if CMDLINE`), and BOOTSTD_PROG (depends
# on !CMDLINE, boot/Kconfig:547) boots through standard boot and panics
# if that fails.  The serial console reaches no prompt, so no command
# set is left to prune.  The EFI boot manager is off too: it would scan
# auto-generated boot options over every block device, removable media
# first; BOOTMETH_EFILOADER alone finds EFI/BOOT/BOOTAA64.EFI on the
# pinned medium.
#
# needs-build (u-boot do_configure): a `select` elsewhere can silently
# keep an "is not set" line below on; the resolved .config is the only
# proof, and kill-switch check 1 greps it for every line here.  Turning
# CMDLINE off hides most symbols below (they live under `if CMDLINE`),
# so an "is not set" line may be absent from the resolved .config
# rather than printed; absent counts as off.

# --- on: the EFI path ---------------------------------------------------
CONFIG_EFI_LOADER=y
CONFIG_BOOTSTD_PROG=y
CONFIG_BOOTMETH_EFILOADER=y
CONFIG_FS_FAT=y
CONFIG_FAT_WRITE=y
CONFIG_FAT_RENAME=y
CONFIG_EFI_SECURE_BOOT=y

# The variable store is volatile: no file store, so no attacker-writable
# file sits in U-Boot's pre-verification path.  systemd-boot lives at the
# removable-media path, so no Boot#### or BootOrder needs to persist.  A
# leaf may choose EFI_VARIABLE_FILE_STORE only with a written reason in
# its header.
CONFIG_EFI_VARIABLE_NO_STORE=y

# PK, KEK, and db come from a build-time seed, so they are write-protected
# at run time.  dbx is not seeded (U-Boot cannot seed a zero-length
# variable): it is absent, and accepts only KEK-signed writes, which do
# not persist under NO_STORE.  The seed is a build artifact generated
# from the same PK/KEK/db the x86_64 gate enrolls; it is never checked
# in.  lamadist-efi-var-seed (inherited in u-boot_%.bbappend) writes it
# to ${S}/lamadist-efivars.seed before configure.  lib/efi_loader/
# Makefile prefixes $(srctree)/, so the name is source-relative.  The
# bbappend stops the build unless this line names the class's file.
CONFIG_EFI_VARIABLES_PRESEED=y
CONFIG_EFI_VAR_SEED_FILE="lamadist-efivars.seed"

# The environment is compiled in and never read from or written to
# storage.
CONFIG_ENV_IS_NOWHERE=y

# The default environment is the one text file below: boot_targets
# pinned to the shipping medium, fdtfile empty so U-Boot never looks for
# a device tree on the medium.  There is no CONFIG_BOOTDELAY: AUTOBOOT
# needs CMDLINE, so with CMDLINE off no autoboot delay or abort check
# exists to configure.  The name is source-relative, as the seed's is:
# u-boot_%.bbappend copies the file into ${S}, and the out-of-tree make
# finds it there through VPATH.
CONFIG_ENV_USE_DEFAULT_ENV_TEXT_FILE=y
CONFIG_ENV_DEFAULT_ENV_TEXT_FILE="lamadist-soquartz.env"

# --- off: the prompt, and the EFI boot manager ---------------------------
# CONFIG_CMDLINE is not set
# CONFIG_EFI_BOOTMGR is not set
# CONFIG_BOOTMETH_EFI_BOOTMGR is not set
# CONFIG_CMD_BOOTEFI_BOOTMGR is not set

# --- off: boot methods Secure Boot does not cover -----------------------
# BOOTSTD_DEFAULTS selects BOOTMETH_DISTRO (extlinux, script, PXE) and
# BOOT_DEFAULTS (CMD_BOOTI, CMD_PXE); a select defeats "is not set", so
# the source of the select goes first.
# CONFIG_BOOTSTD_DEFAULTS is not set
# CONFIG_BOOTMETH_DISTRO is not set
# CONFIG_BOOT_DEFAULTS is not set
# CONFIG_BOOTMETH_EXTLINUX is not set
# CONFIG_BOOTMETH_SCRIPT is not set
# CONFIG_BOOTMETH_EXTLINUX_PXE is not set
# CONFIG_BOOTMETH_VBE is not set
# CONFIG_BOOTMETH_VBE_SIMPLE is not set
# CONFIG_BOOTMETH_ANDROID is not set
# CONFIG_BOOTMETH_CROS is not set
# CONFIG_BOOTMETH_RAUC is not set

# --- off: commands that load and run something unverified ----------------
# CONFIG_CMD_BOOTI is not set
# CONFIG_CMD_BOOTM is not set
# CONFIG_CMD_BOOTZ is not set
# CONFIG_CMD_ELF is not set
# CONFIG_CMD_GO is not set
# CONFIG_CMD_MEMORY is not set
# The command-line twins of the extlinux and script boot methods.
# CONFIG_CMD_PXE is not set
# CONFIG_CMD_SOURCE is not set
# CONFIG_CMD_SYSBOOT is not set
# CONFIG_CMD_BOOTMENU is not set
# CONFIG_CMD_NVEDIT_EFI is not set
# CONFIG_CMD_EFIDEBUG is not set
# CONFIG_CMD_BOOTEFI_SELFTEST is not set

# --- off: variable stores and runtime services we do not use -------------
# CONFIG_EFI_RT_VOLATILE_STORE is not set
# CONFIG_EFI_MM_COMM_TEE is not set
# CONFIG_EFI_VARIABLE_FILE_STORE is not set
# CONFIG_EFI_CAPSULE_ON_DISK is not set
# CONFIG_EFI_HTTP_BOOT is not set

# --- off: paths around the pinned environment and boot medium ------------
# The Rockchip boot-mode code sets preboot to a fastboot or ums command
# from an OS-writable reboot-mode flag (arch/arm/mach-rockchip/
# boot_mode.c:102,106); the gadget stack serves rockusb, ums, fastboot,
# and dfu; OF_BOARD would take a device tree from outside the image;
# BUTTON drives the board's boot-key code.
# CONFIG_USE_PREBOOT is not set
# CONFIG_USB_GADGET is not set
# CONFIG_OF_BOARD is not set
# CONFIG_BUTTON is not set

# --- off: every environment backend and importer -------------------------
# CONFIG_ENV_IS_IN_EEPROM is not set
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_IN_EXT4 is not set
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_MMC is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_SCSI is not set
# CONFIG_ENV_IS_IN_NVRAM is not set
# CONFIG_ENV_IS_IN_ONENAND is not set
# CONFIG_ENV_IS_IN_REMOTE is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_IS_IN_MTD is not set
# CONFIG_ENV_IS_IN_UBI is not set
