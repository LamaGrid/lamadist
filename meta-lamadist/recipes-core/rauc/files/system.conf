# SPDX-License-Identifier: Apache-2.0
#
# LamaDist RAUC system configuration (M3 pass 1: x86_64/QEMU,
# plain signed bundles, systemd-boot boot-counting rollback).
#
# Slot devices resolve by stable GPT PARTLABEL (see
# meta-lamadist/files/wic/lamadist-dmverity-bootdisk.wks.in), not
# by a build-time-baked roothash: the initramfs derives the active
# slot's roothash from the kernel cmdline instead, so raw A/B slots
# can diverge after the first update.  The hash slots are
# parent-linked to their rootfs slot so RAUC treats each pair as one
# update target.
#
# RAUC 1.15.1 has no native systemd-boot bootchooser backend
# (verified against the fetched upstream source's
# src/bootchooser.c: supported_bootloaders = barebox, grub, uboot,
# efi, custom, noop -- no "systemd-boot" entry).  bootloader=custom
# below drives systemd-boot's boot-counting loader entries through
# the script named by [handlers] (see files/systemd-boot-backend).

[system]
compatible=lamadist-@MACHINE@
bootloader=custom
statusfile=/var/lib/rauc/status

[handlers]
bootloader-custom-backend=/usr/lib/rauc/systemd-boot-backend

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=raw
bootname=a

[slot.hash.0]
device=/dev/disk/by-partlabel/hash_a
type=raw
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=raw
bootname=b

[slot.hash.1]
device=/dev/disk/by-partlabel/hash_b
type=raw
parent=rootfs.1
