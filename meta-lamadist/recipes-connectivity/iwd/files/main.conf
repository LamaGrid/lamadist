# iwd configuration baked into the read-only /etc lower.  Network
# profiles are not here: they live on the encrypted /var
# (/var/lib/iwd), provisioned out of band.  Addressing stays with
# systemd-networkd (EnableNetworkConfiguration keeps its default, off).

[General]
# Keep the kernel's own netdev for every radio instead of destroying
# and recreating it at startup.  A recreated device is named from the
# wiphy index, so a driver re-probe would come back as wlan1 and the
# wlan0 network profile would no longer match; the recreate path also
# races when two radios appear at once (the second NEW_INTERFACE fails
# on the name still held by the netdev being deleted), which is how
# the QEMU WiFi test loads its two virtual radios.  The per-driver
# form below cannot cover those radios: iwd matches driver quirks on
# /sys/class/ieee80211/<phy>/device/driver, and mac80211_hwsim radios
# have no driver link.  This key is deprecated in favour of the
# per-driver form and logs a warning at startup; it is still honoured.
UseDefaultInterface=true

[DriverQuirks]
# The same, spelled per driver, for the day the global key goes away.
DefaultInterface=mt7921e
