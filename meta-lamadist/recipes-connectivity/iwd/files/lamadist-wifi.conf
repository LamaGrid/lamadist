# iwd state on the encrypted /var: create the directory when absent and
# relabel it every boot.  systemd creates it labeled through
# file_contexts, but an operator-provisioned profile inherits var_lib_t
# from the LUKS /var, which nothing else relabels (see the lamadist
# SELinux module, recipes-security/refpolicy/files/lamadist.{fc,te}).
d /var/lib/iwd 0700 root root -
Z /var/lib/iwd - - - - -
