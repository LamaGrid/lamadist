#
# LamaDist authentication policy: public-key only.  Password and
# keyboard-interactive authentication over the network are forbidden
# (validation suite property P15 asserts this).  sshd applies the
# first value it reads for each keyword, and the stock sshd_config
# (and its read-only-rootfs copy) includes this directory before any
# other directive, so this file wins.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
