# SPDX-License-Identifier: Apache-2.0
#
# LamaDist SSH cryptographic policy.  sshd applies the first value it
# reads for each keyword, and the stock sshd_config (and its
# read-only-rootfs copy) includes this directory before any other
# directive, so these win.
#
# Policy: cryptography must be quantum-resistant.  Key exchange is
# post-quantum only -- both offered algorithms are hybrids of a
# stabilized post-quantum key encapsulation mechanism (ML-KEM-768,
# FIPS 203; and Streamlined NTRU Prime) with X25519, so a recorded
# session resists a future quantum adversary (validation property
# P16).  The classical curve25519 exchanges are deliberately absent:
# they carry no post-quantum protection, and every SSH client that
# reaches this system supports at least the NTRU Prime hybrid.
#
# Symmetric choices stay conservative under Grover's algorithm:
# 256-bit AEAD ciphers only (128-bit quantum security) and SHA-2
# ETM message authentication codes (the MACs are unused while the
# ciphers are all AEAD).
#
# Host and user authentication remain classical (Ed25519, RSA):
# OpenSSH ships no post-quantum signature algorithm yet.  This is the
# one part of the policy the product cannot satisfy today.  It is a
# lower-priority gap than key exchange -- a broken signature enables
# only live impersonation by a future quantum computer, never
# decryption of recorded traffic -- and it is tracked for the
# eventual post-quantum signature support (or the signed-manifest job
# runner that is planned to replace SSH).  The ed25519 host key is
# named explicitly so the self-healing key generator creates it on a
# system whose persistent /var predates this policy; HostKeyAlgorithms
# then stops the server from offering any legacy key already there.
KexAlgorithms sntrup761x25519-sha512@openssh.com,mlkem768x25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKey /var/lib/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
