# SPDX-License-Identifier: Apache-2.0
#
# LamaDist SSH cryptographic policy.  sshd applies the first value it
# reads for each keyword, and the stock sshd_config (and its
# read-only-rootfs copy) includes this directory before any other
# directive, so these win.
#
# Policy: cryptography must be quantum-resistant.  Every part of the
# SSH handshake below is post-quantum.
#
# Key exchange is post-quantum only: both offered algorithms are
# hybrids of a stabilized post-quantum key encapsulation mechanism
# (ML-KEM-768, FIPS 203; and Streamlined NTRU Prime) with X25519, so a
# recorded session resists a future quantum adversary.
#
# Authentication is post-quantum only: the host key and the accepted
# user keys are ssh-mldsa44-ed25519, a hybrid of the ML-DSA-44
# signature (FIPS 204) with Ed25519.  This requires OpenSSH 10.4,
# backported into this layer (see openssh_10.4p1.bb); the classical
# Ed25519, ECDSA, and RSA signatures are no longer offered or
# accepted.  The named HostKey lets the self-healing key generator
# create it on a system whose persistent /var predates this policy,
# and HostKeyAlgorithms stops the server from offering any legacy key
# already sitting there.
#
# Symmetric choices stay conservative under Grover's algorithm:
# 256-bit AEAD ciphers only and SHA-2 ETM message authentication codes
# (the MACs are unused while the ciphers are all AEAD).
KexAlgorithms sntrup761x25519-sha512@openssh.com,mlkem768x25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKey /var/lib/ssh/ssh_host_mldsa44-ed25519_key
HostKeyAlgorithms ssh-mldsa44-ed25519@openssh.com,ssh-mldsa44-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-mldsa44-ed25519@openssh.com,ssh-mldsa44-ed25519-cert-v01@openssh.com
