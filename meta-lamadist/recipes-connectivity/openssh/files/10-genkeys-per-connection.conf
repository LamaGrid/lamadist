#
# sshd.socket Wants=sshdgenkeys.service exactly once, at socket
# start.  If that one job is swept by a dependency-fail cascade
# (observed on this image's first boot: systemd's veritysetup
# generator timing out while the socket started), no host keys are
# ever generated, and every sshd@ instance dies before the SSH
# banner -- silently, because upstream's ExecStart carries the '-'
# failure-masking prefix.  Wanting the keygen from every
# per-connection instance (the ordering After=sshdgenkeys.service is
# already upstream) makes key generation self-healing; the oneshot's
# RemainAfterExit makes repeat pulls free.
[Unit]
Wants=sshdgenkeys.service
