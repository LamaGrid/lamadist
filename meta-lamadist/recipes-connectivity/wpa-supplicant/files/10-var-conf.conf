# wpa_supplicant on wlan0 reads its SSID and PSK from the encrypted
# /var, never from a baked-in file, so the secret stays off the image
# and on the LUKS-protected partition.  Order the instance after the
# /var mount so the config exists when the daemon starts.  The base
# unit's ExecStart points at /etc/wpa_supplicant/wpa_supplicant-%I.conf,
# which lives on the overlay-locked /etc this image cannot provision at
# runtime, so it is replaced with the /var path here.
[Unit]
After=var.mount
Requires=var.mount

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/var/lib/lamadist-wifi/wpa_supplicant-wlan0.conf -iwlan0
