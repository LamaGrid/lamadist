# Relabel the operator-provisioned WiFi config dir on the encrypted /var
# so the confined wpa_supplicant (NetworkManager_t) can read it.  The
# dir and its wpa_supplicant-wlan0.conf are created at runtime and
# inherit var_lib_t, which nothing else relabels on /var: `d` creates
# the dir with its fcontext type on a fresh /var, and `Z` relabels the
# dir and its contents to NetworkManager_var_lib_t on every boot.  See
# meta-lamadist/recipes-security/refpolicy/files/lamadist.{fc,te}.
d /var/lib/lamadist-wifi 0700 root root -
Z /var/lib/lamadist-wifi - - - - -
