# SPDX-License-Identifier: Apache-2.0
#
# SOQuartz (RK3566) on the Model A baseboard: the LamaDist leaf for the
# first Rockchip port (ADR 0013).  Boot chain: BootROM -> rkbin DDR TPL
# -> SPL -> BL31 -> U-Boot as the UEFI provider -> systemd-boot at
# EFI/BOOT/BOOTAA64.EFI -> per-slot signed UKI -> dm-verity root, with
# the sdboot-uki backend unchanged.
#
# Trust (ADR 0013 decision 4): Secure Boot on this unfused board is an
# enforcement mechanism, not a root of trust -- it stops an attacker who
# can only write the ESP or supply removable media, but not one with OS
# root in any domain that can open the whole-disk node (the preseeded db
# lives in the raw loader sectors, and nothing verifies U-Boot, the DDR
# TPL, or BL31), so it is strictly weaker than x86_64.
#
# Leaf name: upstream already supplies the machine (soquartz-model-a:
# device tree, U-Boot defconfig, SoC include), so this leaf only adds
# the LamaDist policy on top, mirroring qemuarm64-lamadist.  It cannot
# take the upstream name: a layer-local soquartz-model-a.conf would be
# found first on BBPATH and the require below would recurse into it.
# It avoids plain "soquartz" because that is upstream's family
# MACHINEOVERRIDE (soquartz.inc), which would blur the machine-scoped
# bbappends.  linux-rockchip's COMPATIBLE_MACHINE:soquartz matches
# through that override, so this name needs no kernel change.
#
# Checks only a parse or a build settles (none run by tests/layer):
#   needs-parse: bitbake -e lamadist-image-base shows RK_KERNEL_FITIMAGE
#     False, KERNEL_IMAGETYPE Image, UBOOT_EXTLINUX 0, no u-boot-extlinux
#     in MACHINE_ESSENTIAL_EXTRA_RDEPENDS, no linux-yocto-fitimage in
#     KERNEL_DEPLOY_DEPEND, WKS_FILE_DEPENDS carrying u-boot, and
#     PREFERRED_PROVIDER_virtual/bootloader still systemd-boot.
#   needs-build: u-boot do_configure (the .config holds the fragment
#     lamadist-soquartz-efi.cfg and the pinned environment), then
#     loader2 (u-boot.itb) holding U-Boot, BL31, and the device tree.

# The fitImage gate MUST be closed before the SoC include is required:
# rockchip-defaults.inc:7,12 reads it at require time to decide whether
# to pull rockchip-fitimage.inc.  A fitImage cannot be a UKI payload.
RK_KERNEL_FITIMAGE = "False"
# With the gate false, rockchip-defaults.inc:13 falls back to zImage,
# which an arm64 kernel cannot build; name the arm64 image explicitly.
KERNEL_IMAGETYPE = "Image"

# Compress the wic with zstd like the other leaves.  rockchip-wic.inc:12
# appends "wic${WIC_COMPRESSION_EXTENSION}", so this must precede it.
WIC_COMPRESSION_EXTENSION ?= ".zst"

# Upstream machine: KERNEL_DEVICETREE and UBOOT_MACHINE (the defconfig)
# come from here, plus rk3566.inc and rockchip-wic.inc.
require conf/machine/soquartz-model-a.conf

require conf/machine/include/lamadist-dmverity.inc
require conf/machine/include/lamadist-boot-sdboot-uki.inc

# The board device tree rides inside the signed UKI (ukify --devicetree,
# first KERNEL_DEVICETREE entry from the upstream machine) and
# systemd-stub installs it, so no tree is read from the medium (ADR 0013
# decisions 1 and 3, kill-switch check 14).
LAMADIST_UKI_EMBED_DTB = "1"

# No TPM include: RK3566 has no upstream OP-TEE port, so this board runs
# in the no-TPM state (ADR 0013 decisions 6 and 7).  The shared boot
# include keeps virtual/bootloader on systemd-boot and fails closed.

# Competing boot paths, neutralised explicitly (ADR 0013 decision 10).
# The extlinux wiring (rockchip-extlinux.inc:14,24) would generate an
# extlinux.conf and pull u-boot-extlinux into the image.  The
# rk-u-boot-env machine feature and RK_RAUC_DEMO stay unset on purpose:
# U-Boot keeps no persistent environment (ENV_IS_NOWHERE).
UBOOT_EXTLINUX = "0"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "u-boot-extlinux"

# U-Boot reaches the image through the WKS rawcopy files (idbloader.img
# and u-boot.itb), not through virtual/bootloader: naming u-boot here
# makes do_image_wic depend on u-boot:do_deploy (image_types_wic.bbclass
# recrdeptask do_deploy).  rockchip-wic.inc:15 sets a weaker list that
# lacks the oe-core defaults, so restore them.
WKS_FILE_DEPENDS = "${WKS_FILE_DEPENDS_DEFAULT} ${WKS_FILE_DEPENDS_BOOTLOADERS} u-boot"

WKS_FILE = 'lamadist-rockchip-bootdisk.wks.in'
# rockchip-wic.inc:12 already adds the wic types, which makes a weak
# default like intel.conf's IMAGE_FSTYPES ?= a no-op here, so append the
# erofs image the verity slots rawcopy.
IMAGE_FSTYPES += 'erofs-lz4hc'

# PROVISIONAL (owner decision #9, open): the console UART and baud are
# the upstream SOQuartz default (rockchip-defaults.inc:28, UART2 at
# 1500000 baud; the U-Boot defconfig agrees: CONFIG_BAUDRATE=1500000).
# One UART and baud must serve U-Boot's EFI console, systemd-boot, the
# kernel command line, and the getty.  The LAST console= owns
# /dev/console, as in the other leaves.
SERIAL_CONSOLES = "1500000;ttyS2"
LAMADIST_CONSOLES ?= "console=tty0 console=ttyS2,1500000"
APPEND:append = " ${LAMADIST_CONSOLES}"

# No systemd-boot menu timeout on the serial console (ADR 0013 decision
# 3): a 0 timeout hides the menu but keeps a 100 ms key read, and one
# key in that time opens a menu that has no time limit.  The owner chose
# menu-disabled, which skips that read (ADR 0013 decision 3); this leaf
# keeps 0 until the change that sets menu-disabled lands.  Quitting the
# menu returns to U-Boot, which has no prompt.  The knob is the one
# lamadist-esp-slot-a.bbclass reads; the other leaves keep its default.
LAMADIST_BOOT_ENTRY_TIMEOUT ?= "0"

# IMA in log mode, identical policy to intel.conf.
APPEND:append = ' ima_policy=tcb ima_appraise=log'
