# SPDX-License-Identifier: Apache-2.0
#
# Emulated aarch64 machine for the M5 boot-smoke gate.
#
# Reuses the systemd-boot + UKI boot backend on ARM UEFI firmware
# (AAVMF), so it exercises the architecture-portable half of the
# stack -- EROFS + dm-verity, the signed UKI, systemd-boot A/B slot
# selection, SELinux enforcing, LUKS /var, and the RAUC health gate
# -- on aarch64, without the board-specific U-Boot and L4T chains
# that only real silicon can validate.  It is the emulated parity
# target the M5 exit criteria name; it is NOT a substitute for
# on-hardware validation of the Rockchip or Tegra boot chains.

require conf/machine/qemuarm64.conf

# Inherit the qemuarm64 base overrides (kernel COMPATIBLE_MACHINE,
# virtio, qemuboot wiring) the same way intel.conf inherits
# genericx86-64.
MACHINEOVERRIDES =. "qemuarm64:"

require conf/machine/include/lamadist-dmverity.inc
require conf/machine/include/lamadist-boot-sdboot-uki.inc

# The tpm2 DISTRO_FEATURE is required at BUILD time: lamadist-luks-var
# (LUKS /var) does a features_check on "systemd luks tpm2", so the OS
# stack does not build without it.  Enabling it here also configures
# TPM2 measured boot.  At RUNTIME under qemu -machine virt the enroll
# service needs an emulated TPM (swtpm), which the vm task wires only
# for x86 today; until the ARM vm path adds swtpm, the TPM2 keyslot
# enrollment fails soft and LUKS /var unlocks through its development
# keyfile keyslot -- fine for a boot smoke, not a measured-boot proof.
require conf/machine/include/lamadist-tpm2.inc

# linux-yocto is COMPATIBLE via the qemuarm64 override above, but its
# BSP definition is keyed on KMACHINE, which defaults to the machine
# name.  This leaf has no kernel BSP of its own, so point its kernel
# metadata at the base qemuarm64 BSP (qemuarm64/standard).
KMACHINE:qemuarm64-lamadist = "qemuarm64"

WKS_FILE = 'lamadist-dmverity-bootdisk.wks.in'

# Policy default (weak) so KAS overlays and local.conf still win --
# same rationale as intel.conf.
IMAGE_FSTYPES ?= 'erofs-lz4hc wic.zst wic.bmap'

# qemu-system-aarch64 -machine virt exposes a PL011 UART at ttyAMA0.
# The LAST console= owns /dev/console (userspace stdio, systemd
# prompts); keep the serial console last so the headless CI smoke
# drives it, matching the intel default's intent.
LAMADIST_CONSOLES ?= "console=tty0 console=ttyAMA0,115200"
APPEND:append = " ${LAMADIST_CONSOLES}"

# IMA in log mode, identical policy to intel.conf (measure + audit,
# no appraisal enforcement).
APPEND:append = ' ima_policy=tcb ima_appraise=log'
