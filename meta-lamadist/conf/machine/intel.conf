#
# Intel x86-64 machine configuration for LamaDist.
#
# Extends the Yocto genericx86-64 BSP with dm-verity partition
# layout and output formats.

require conf/machine/genericx86-64.conf

# Inherit all genericx86-64 overrides (kernel COMPATIBLE_MACHINE,
# kernel config fragments, etc.)
MACHINEOVERRIDES =. "genericx86-64:"

require conf/machine/include/lamadist-dmverity.inc
require conf/machine/include/lamadist-tpm2.inc

WKS_FILE = 'lamadist-dmverity-bootdisk.wks.in'
IMAGE_FSTYPES = 'erofs-lz4hc wic.xz wic.bmap'

# Kernel console order.  The LAST console= owns /dev/console
# (userspace stdio, systemd status lines, password prompts); the
# kernel logs to every listed console.  The default is the QEMU/CI
# order every serial-driven harness expects: serial keeps
# /dev/console, tty0 only gains the kernel log;
# kas/extras/hw-console.kas.yml flips it for physical machines
# (graphics primary, serial secondary).
LAMADIST_CONSOLES ?= "console=tty0 console=ttyS0,115200"
APPEND:append = " ${LAMADIST_CONSOLES}"

# IMA in log mode (M4 plan D7): measure + audit, no appraisal
# enforcement.  ima_appraise=log makes appraisal violations log-only
# rather than blocking; ima_policy=tcb loads the built-in TCB
# measurement policy.  The rootfs-signing half is wired in
# lamadist-security.inc (ima-evm-rootfs, packagegroup-ima); this is
# the only piece that must ride the kernel cmdline, which on this
# image is the UKI's embedded .cmdline built from APPEND by
# lamadist-uki.bbclass.  Kernel support verified: CONFIG_IMA=y,
# CONFIG_IMA_APPRAISE=y.  Full appraisal enforcement is deferred
# (D7) -- flagged for review at milestone close.
APPEND:append = ' ima_policy=tcb ima_appraise=log'
