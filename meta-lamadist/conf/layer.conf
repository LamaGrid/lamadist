BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += 'lamadist'
BBFILE_PATTERN_lamadist = "^${LAYERDIR}/"
BBFILE_PRIORITY_lamadist = '50'

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_lamadist = '1'

LAYERSERIES_COMPAT_lamadist = 'wrynose'

# Python helpers under lib/lamadist (the memory-aware BitBake
# scheduler selected by the build task's memory plan).
addpylib ${LAYERDIR}/lib lamadist

# This layer's own directory, copied immediately (:=) because LAYERDIR
# is only valid while layer.conf parses.  Classes that must read a file
# from this layer (lamadist-efi-var-seed) use it instead of a BBPATH
# search, which any earlier layer or the build directory can shadow.
LAMADIST_LAYERDIR := "${LAYERDIR}"
LAYERDEPENDS_lamadist = 'core security selinux secure-core signing-key integrity-layer encrypted-storage'

# This is used by the tegra-distro-sanity bbclass
# to identify the distro layer directory during
# bblayers checks.
#TD_DISTRO_LAYERDIR = "${LAYERDIR}"
