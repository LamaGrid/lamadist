# The root filesystem is erofs-lz4hc under dm-verity.  As with
# squashfs, SELinux's sb_finish_set_opts() rejects mounting any
# filesystem whose root inode lacks xattr support -- even in
# permissive mode -- so xattr/security support is not optional.
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_XATTR=y
CONFIG_EROFS_FS_SECURITY=y
CONFIG_EROFS_FS_POSIX_ACL=y
CONFIG_EROFS_FS_ZIP=y
