# MediaTek MT7921/MT7922 PCIe Wi-Fi via the mt76 driver family.  MT7921E
# is the PCIe entry point and covers the MT7922 (Wi-Fi 6E) part; enabling
# it as a module selects the MT7921_COMMON -> MT792x_LIB ->
# MT76_CONNAC_LIB -> MT76_CORE library chain automatically.  CFG80211 and
# MAC80211 are already modular.  Built as a module, so it is inert on a
# machine whose board carries no such card.
CONFIG_MT7921E=m
