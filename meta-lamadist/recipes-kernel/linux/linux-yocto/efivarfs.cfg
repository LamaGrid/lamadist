# efivarfs must be built in: the boot-counting ledger, the Secure Boot
# state the boot gate asserts, and systemd-boot's loader variables all
# live in /sys/firmware/efi/efivars.  The x86-64 kernel already selects
# it; the aarch64 defconfig leaves it a module that the image does not
# ship, so the mount never had a driver to load.
CONFIG_EFIVAR_FS=y
