# Virtual mac80211 radios for a guest with no wireless hardware.  The
# QEMU WiFi test loads it with radios=2 to get a station and an access
# point that see each other's frames in-kernel, so association, DHCP,
# and the supplicant's confinement can be checked without a real card.
# Test-only: this fragment is pulled in by LAMADIST_TEST_HWSIM (QA and
# debug builds), never by a release build.
CONFIG_MAC80211_HWSIM=m
