# PKCS#8 private-key parser for the kernel keyring.  iwd ships a
# modules-load.d entry that asks for pkcs8_key_parser at boot (its
# EAP-TLS path loads client keys through the keyring); without the
# module, systemd-modules-load.service fails and the RAUC health gate
# reads that as a degraded boot.  ASYMMETRIC_PUBLIC_KEY_SUBTYPE, the
# X.509 and PKCS#7 parsers are already built in.  A module, so it costs
# nothing until iwd loads it.
CONFIG_PKCS8_PRIVATE_KEY_PARSER=m
