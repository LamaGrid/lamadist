# On an SELinux system, sb_finish_set_opts() rejects any mount of a
# filesystem whose root inode lacks xattr support with EOPNOTSUPP --
# even in permissive mode, since the check precedes access decisions.
# RAUC verity bundles are squashfs images, so squashfs must carry
# xattr support or every bundle mount fails.
CONFIG_SQUASHFS_XATTR=y
