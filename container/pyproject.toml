#
# Python dependencies for the LamaDist KAS build container.
#
# See docs/TOOLING.md for details.

[project]
name = "lamadist-builder"
version = "0.0.0"
description = "Python dependencies for the LamaDist KAS build container"
requires-python = ">=3.10"
dependencies = [
  "kas",
  "yamllint",
  "check-jsonschema",
  # M4 W10 (ovmf-vars): enrolls PK/KEK/db and SecureBoot into the
  # OVMF vars template to build the --secureboot test artifact; see
  # .mise/tasks/ovmf-vars.
  "virt-firmware",
]
