# SPDX-License-Identifier: Apache-2.0
# Tool configuration only; the repo has no Python distribution.
# The validation suite imports .mise/lib/validate at runtime through
# conftest.py, so the type checker needs the same path.

[tool.pyright]
extraPaths = [".mise/lib"]
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"

# Runs inside the builder image (Ubuntu 22.04, Python 3.10) in CI.
[tool.ruff.per-file-target-version]
".mise/lib/publish.py" = "py310"
