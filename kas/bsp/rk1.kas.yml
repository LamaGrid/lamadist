---
header:
  version: 15

# NOTE: meta-rockchip (wrynose) defines no upstream rk1/turing
# machine.  meta-lamadist/conf/machine/rk1.conf is authored in the
# gated M5 port work; until then this stub cannot reach a parseable
# machine.
machine: rk1
target:
  - lamadist-image-base

repos:
  meta-arm:
    url: 'https://git.yoctoproject.org/meta-arm'
    path: 'ext/meta-arm'
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-rockchip:
    url: 'https://git.yoctoproject.org/meta-rockchip'
    path: 'ext/meta-rockchip'
    branch: wrynose

  # The encrypted-storage layer (LUKS /var) hard-depends on the
  # meta-tpm2 layer even when the no-tpm overlay is on.  The layer adds
  # no DISTRO_FEATURE; the machine include decides on tpm2.
  meta-secure-core:
    url: 'https://github.com/Wind-River/meta-secure-core.git'
    path: 'ext/meta-secure-core'
    layers:
      meta-tpm2:
