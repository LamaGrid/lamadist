---
header:
  version: 15

machine: jetson-orin-nano-devkit-nvme
# machine: p3768-0000-p3767-0000.conf

target:
  - lamadist-image-base

repos:
  meta-arm:
    url: 'https://git.yoctoproject.org/meta-arm'
    path: 'ext/meta-arm'

  meta-tegra:
    url: 'https://github.com/OE4T/meta-tegra.git'
    path: 'ext/meta-tegra'
    branch: wrynose

  meta-tegra-community:
    url: 'https://github.com/OE4T/meta-tegra-community.git'
    path: 'ext/meta-tegra-community'
    branch: wrynose

# No GUID local_conf_header: the aarch64 dm-verity DPS GUIDs live
# as per-arch overrides in
# meta-lamadist/conf/machine/include/lamadist-dmverity.inc, which
# the M5 backend refactor's thin-leaf LamaDist machine conf will
# require.  The stock meta-tegra machine above does not include it,
# and the ARM image build is gated on that same M5 work anyway.
