---
# Test overlay: build the U-Boot qemu_arm64 payload for `vm --firmware
# u-boot` (ADR 0013 open question 6).  Stack it after
# kas/bsp/qemuarm64.kas.yml and build the payload with
# `bitbake u-boot -c deploy`; it lands as u-boot.bin next to the WIC in
# the qemuarm64-lamadist deploy dir.  The image itself does not change:
# the variable below is read only by the U-Boot bbappend, so every
# image task signature stays the one the plain qemuarm64 build has.
#
# The payload proves U-Boot's EFI code at the pinned tag, never the SoC.
# Never cite a result from it as a board property; every check re-runs
# on the board .config.  See meta-lamadist/recipes-bsp/u-boot/
# lamadist-uboot-vm.inc.
header:
  version: 15
local_conf_header:
  90_uboot_vm: |
    LAMADIST_UBOOT_VM = "1"
