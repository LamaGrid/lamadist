---
header:
  version: 15

env:
  BB_PRESSURE_MAX_CPU:
  BB_PRESSURE_MAX_IO:
  BB_PRESSURE_MAX_MEMORY:
  BUILDNAME:
  BUILDSTATS_BASE:
  DISTRO_VERSION:
  DISPLAY:

build_system: oe

distro: lamadist

defaults:
  repos:
    branch: wrynose

repos:
  # Package layers
  meta-openembedded:
    url: 'https://github.com/openembedded/meta-openembedded.git'
    path: 'ext/meta-openembedded'
    layers:
      meta-oe:
      meta-filesystems:
      meta-networking:
      meta-perl:
      meta-python:

  meta-clang:
    url: 'https://github.com/kraj/meta-clang.git'
    path: 'ext/meta-clang'
    branch: wrynose

  # Core build system.  Since whinlatter (5.3) the poky repo is no
  # longer branched; the supported setup is separate bitbake and
  # openembedded-core clones.  bitbake 2.18 is the 6.0 (wrynose)
  # series.
  bitbake:
    url: 'https://git.openembedded.org/bitbake'
    path: 'ext/bitbake'
    branch: '2.18'
    layers:
      .: disabled

  openembedded-core:
    url: 'https://git.openembedded.org/openembedded-core'
    path: 'ext/openembedded-core'
    layers:
      meta:

  meta-lamadist:
    path: 'meta-lamadist'

  # Security layers
  meta-secure-core:
    url: 'https://github.com/Wind-River/meta-secure-core.git'
    path: 'ext/meta-secure-core'
    layers:
      meta-secure-core-common:
      meta-encrypted-storage:
      meta-integrity:
      meta-signing-key:
  #      meta-efi-secure-boot:

  meta-selinux:
    url: 'https://git.yoctoproject.org/meta-selinux'
    path: 'ext/meta-selinux'

  meta-security:
    url: 'https://git.yoctoproject.org/meta-security'
    path: 'ext/meta-security'

# Build infrastructure settings.  Only build-environment-specific settings
# should appear here.
#
#  NOTE: Place distro policy in `meta-lamadist/conf/distro`, machine config
#        in `meta-lamadist/conf/machine/.`

local_conf_header:
  10_disk_monitor: |
    BB_DISKMON_DIRS                     ??= " \
        STOPTASKS,${BUILDSTATS_BASE},10M,100K \
        STOPTASKS,${TMPDIR},1G,100K           \
        STOPTASKS,${DL_DIR},1G,100K           \
        STOPTASKS,${SSTATE_DIR},1G,100K       \
        STOPTASKS,/tmp,100M,100K              \
        HALT,${BUILDSTATS_BASE},1M,5K         \
        HALT,${TMPDIR},100M,1K                \
        HALT,${DL_DIR},100M,1K                \
        HALT,${SSTATE_DIR},100M,1K            \
        HALT,/tmp,10M,1K"

  10_build_options: |
    # Build metadata
    INHERIT                              += 'buildhistory'
    BUILDHISTORY_COMMIT                   = '1'
    USER_CLASSES                         += 'buildstats buildstats-summary'

  10_deploy: |
    DEPLOY_DIR = "${TOPDIR}/../deploy"

  # FIXME: Create a private sstate-cache and hashserv server.  Trusting
  # public servers is insecure.  When a private hashserv is deployed,
  # set BB_HASHSERVE = 'auto', re-add
  # BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}" (the db must sit beside the
  # shared sstate dir, not the per-build TOPDIR, or sstate reuse
  # breaks), and remove the BB_SIGNATURE_HANDLER override below so
  # bitbake.conf's OEEquivHash default applies again.
  10_cache: |
    # NOTE: SSTATE_DIR is set via env var (container mount at
    # /sstate); do not hardcode it here.
    # Hash equivalence is explicitly disabled until a private
    # hashserv exists (see FIXME above).  Wrynose defaults
    # BB_SIGNATURE_HANDLER to 'OEEquivHash', which hard-requires
    # BB_HASHSERVE (bb.fatal otherwise), so BB_HASHSERVE = '' alone
    # is not enough -- the handler must drop to 'OEBasicHash' too.
    # This also silences sanity.bbclass's "local hash equivalence
    # server ... sstate mirror" warning, which only fires for
    # OEEquivHash.  Connecting to the public upstream hashserv during
    # bitbake init can cause a 60 s timeout when DNS or TCP is
    # unreachable from inside the build container.
    BB_HASHSERVE = ''
    # BB_HASHSERVE_UPSTREAM = 'hashserv.yocto.io:8687'
    BB_SIGNATURE_HANDLER = 'OEBasicHash'
    SSTATE_MIRRORS = 'file://.* https://sstate.yoctoproject.org/PATH;downloadfilename=PATH'
