# SPDX-License-Identifier: Apache-2.0
#
# LamaDist USB installer stick build (ADRs 0006-0008).  Retires the
# earlier meta-anaconda scaffold (rejected in AOA-INSTALLER): the
# installer is a purpose-built live userland in one signed UKI, built
# by meta-lamadist alone.  Layers over the x86_64 BSP, so it builds
# the hardened base image (the payload) and then the installer stick
# that carries it.
---
header:
  version: 15
  includes:
    - main.kas.yml
    - bsp/x86_64.kas.yml

target:
  - lamadist-image-base
  - intel-microcode
  - lamadist-installer-image
