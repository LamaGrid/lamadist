# SPDX-License-Identifier: Apache-2.0
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'BSP target to build'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - qemuarm64
          - rk1
          - soquartz
          - orin-nx
          - all
      release:
        description: >-
          Build x86_64 with --release (full SPDX source inventory,
          xz -9e, no test SSH key)
        required: false
        default: false
        type: boolean
      icecc:
        description: 'x86_64: distribute compiles through icecc'
        required: false
        default: true
        type: boolean
      cold:
        description: >-
          x86_64: cold build (fresh run-scoped sstate and buildstats,
          no public sstate mirror) with timing and memory reported
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_COLOR: 'false'
  # Persist mise's tool installs in the shared runner toolcache PV
  # (same chain the GitVersion action uses: PVC -> runner
  # _work/_tool -> job container /__w/_tool).  Both scale sets
  # share the RWO volume; mise's own file locking handles
  # concurrent jobs.
  MISE_DATA_DIR: /__w/_tool/mise/data
  MISE_CACHE_DIR: /__w/_tool/mise/cache
  BUILDSTATS_BASE: /__w/_buildstats
  SSTATE_DIR: /__w/_sstate
  # Dedicated downloads PV (pvc-yocto-downloads); the yocto work
  # volume itself is ephemeral per-job since the runner storage
  # split, so DL_DIR must live outside it to stay warm.
  DL_DIR: /__w/_downloads
  LAMADIST_HOST_BUILDSTATS_BASE: /__w/_buildstats
  LAMADIST_HOST_SSTATE_DIR: /__w/_sstate
  LAMADIST_CONTAINER_IMAGE: lamadist-builder:latest
  CONTAINER_REGISTRY: registry.local:5000
  BUILDER_UID: '1001'
  # Use overlay storage driver — pods have kernel overlay permissions
  STORAGE_DRIVER: overlay

jobs:
  version:
    name: Version
    runs-on: container-build-set
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 10
    outputs:
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      container_build_needed: ${{ steps.check.outputs.build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.3.3
        with:
          versionSpec: '6.6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.3.3

      - name: Check if container rebuild needed
        id: check
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          BUILD_NEEDED=false

          CHANGES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --depth=1 origin "${{ github.base_ref }}"
              CHANGES=$(git diff --name-only FETCH_HEAD -- container/)
          elif [ "${{ github.event_name }}" = "push" ]; then
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                  CHANGES=$(git diff --name-only HEAD~1 -- container/ 2>/dev/null || echo "initial push")
              else
                  # On feature branches, compare against main to detect any divergence
                  git fetch origin main
                  CHANGES=$(git diff --name-only origin/main...HEAD -- container/ 2>/dev/null || echo "new branch")
              fi
          fi

          if [ -n "${CHANGES}" ]; then
              echo "Container files changed:"
              echo "${CHANGES}"
              BUILD_NEEDED=true
          else
              echo "No container/ changes, skipping rebuild"
          fi

          echo "build_needed=${BUILD_NEEDED}" >> "$GITHUB_OUTPUT"

  build-container:
    name: Build Container
    needs: version
    if: needs.version.outputs.container_build_needed == 'true'
    runs-on: container-build-set
    container:
      image: quay.io/podman/stable
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure container storage
        run: |
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          [storage.options.overlay]
          mount_program = ""
          EOF
          sed -i 's/^ *//' /etc/containers/storage.conf

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Build and push container image
        run: mise run container:builder:build --ci

  build-x86-64:
    name: Build x86_64
    needs: [version, build-container]
    if: ${{ !cancelled() && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped') }}
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    env:
      KAS_WORK_DIR: ${{ github.workspace }}
    # A release build (dispatch with release=true) serializes the
    # SPDX chain at the 11 GiB pod ceiling: measured ~6.4 h for
    # SPDX alone (run 33823958778), so the default 480 leaves no
    # margin.  Push and PR builds run the QA profile and never pay
    # it: ~12 min warm, ~4 h cold.
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Clean workspace (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          echo "Cleaned build/tmp directory"

      # A push to main runs the same build its PR ran: same sstate
      # universe, so the merge re-verifies what the PR proved in
      # minutes.  The release profile (full SPDX source inventory,
      # xz -9e, no test key) is dispatch-only: its SPDX chain never
      # restores across commits, so on every merge it cost hours for
      # an artifact nothing consumed.
      # A cold run gets its own sstate and buildstats directories on
      # the job's ephemeral work volume and drops the public sstate
      # mirror, so nothing is restored and its stats are its own.
      - name: Prepare cold build
        if: inputs.cold
        run: |
          cold="${RUNNER_TEMP}/cold"
          mkdir -p "${cold}/sstate" "${cold}/buildstats"
          {
            echo "SSTATE_DIR=${cold}/sstate"
            echo "LAMADIST_HOST_SSTATE_DIR=${cold}/sstate"
            echo "BUILDSTATS_BASE=${cold}/buildstats"
            echo "LAMADIST_HOST_BUILDSTATS_BASE=${cold}/buildstats"
          } >> "${GITHUB_ENV}"
          sed -i "/^ *SSTATE_MIRRORS = /d" kas/main.kas.yml
          if grep -n 'SSTATE_MIRRORS' kas/main.kas.yml; then
            echo "::error::the public sstate mirror is still configured"
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          df -h "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}" /__w/_downloads
          free_gib=$(df --output=avail -BG "${RUNNER_TEMP}" | tail -1 | tr -dc 0-9)
          echo "free on the work volume: ${free_gib} GiB"
          if [ "${free_gib}" -lt 150 ]; then
            echo "::error::a cold build needs >= 150 GiB free for tmp and sstate"
            exit 1
          fi
          echo "g++: $(command -v g++ || echo MISSING)"
          echo "icecc: $(icecc --version 2>&1 | head -1)"

      - name: Build
        run: |
          flags="--qa --include-scans"
          [ "${{ inputs.release }}" = "true" ] && flags="--release"
          [ "${{ inputs.icecc }}" != "false" ] && flags="${flags} --icecc"
          echo "build flags: ${flags}"
          echo "SSTATE_DIR=${SSTATE_DIR} BUILDSTATS_BASE=${BUILDSTATS_BASE}"
          start=$(date +%s)
          rc=0
          # shellcheck disable=SC2086
          mise run build --bsp x86_64 --ci ${flags} || rc=$?
          echo "BUILD_WALL_SECONDS=$(( $(date +%s) - start ))" | tee -a "${GITHUB_ENV}"
          exit "${rc}"
        env:
          GITVERSION_INFO_VERSION: ${{ needs.version.outputs.informationalVersion }}
          GITVERSION_FULL_SEM_VER: ${{ needs.version.outputs.fullSemVer }}
          # Site configuration: the scheduler address is a repo
          # Actions secret (not a variable) so run logs mask the
          # value.  Unset -- including fork PRs, which never
          # receive secrets -- means the build task disables icecc
          # and compiles locally.
          LAMADIST_ICECC_SCHEDULER: ${{ secrets.LAMADIST_ICECC_SCHEDULER }}
          # Private hash-equivalence server (see kas/main.kas.yml
          # 10_cache).  Also a masked secret: infrastructure names
          # stay out of public run logs.  Unset falls back to
          # OEBasicHash, same as any third-party build.
          LAMADIST_HASHSERVE: ${{ secrets.LAMADIST_HASHSERVE }}
          # No static parallelism pin: the build task auto-sizes
          # threads, make jobs, and per-class memory caps from the
          # pod's own cgroup limits (see write_dynamic_overlay in
          # .mise/tasks/_lib.sh).
          # Bound the icecc fan-out for the pod: each remote job
          # runs a local preprocessor, and the overlay's -j40
          # default OOM-killed the job cgroup (run 33470552892).
          LAMADIST_ICECC_JOBS: "12"

      - name: Report cold build measurements
        if: ${{ always() && inputs.cold }}
        run: |
          echo "icecc requested: ${{ inputs.icecc }}"
          echo "build wall: ${BUILD_WALL_SECONDS:-unknown} s"
          for f in memory.peak memory.max memory.swap.peak; do
            printf '%s: ' "${f}"; cat "/sys/fs/cgroup/${f}" 2>/dev/null || echo n/a
          done
          python3 - "${BUILDSTATS_BASE}" <<'PY'
          import os, re, sys
          from datetime import datetime
          base = sys.argv[1]
          runs = sorted(d for d in os.listdir(base) if os.path.isdir(os.path.join(base, d)))
          if not runs:
              sys.exit("no buildstats run directory")
          run = os.path.join(base, runs[-1])
          def fields(path):
              out = {}
              for line in open(path, errors="replace"):
                  k, _, v = line.partition(":")
                  out[k.strip()] = v.strip()
              return out
          rows = []  # (task, recipe, start, end)
          for recipe in os.listdir(run):
              rdir = os.path.join(run, recipe)
              if not os.path.isdir(rdir):
                  continue
              for task in os.listdir(rdir):
                  f = fields(os.path.join(rdir, task))
                  try:
                      rows.append((task, recipe, float(f["Started"]), float(f["Ended"])))
                  except (KeyError, ValueError):
                      continue
          print(f"buildstats run: {runs[-1]}; tasks: {len(rows)}")
          print(f"bitbake task span: {max(r[3] for r in rows) - min(r[2] for r in rows):.0f} s")
          def union(spans):
              total, cur = 0.0, None
              for s, e in sorted(spans):
                  if cur and s <= cur[1]:
                      cur[1] = max(cur[1], e)
                  else:
                      total += (cur[1] - cur[0]) if cur else 0
                      cur = [s, e]
              return total + ((cur[1] - cur[0]) if cur else 0)
          for name in ("do_compile", "do_configure", "do_install", "do_package"):
              spans = [(s, e) for t, _, s, e in rows if t == name]
              if spans:
                  print(f"{name}: {len(spans)} tasks, summed {sum(e - s for s, e in spans):.0f} s, "
                        f"wall with >=1 running {union(spans):.0f} s")
          top = sorted(((e - s, r) for t, r, s, e in rows if t == "do_compile"), reverse=True)[:10]
          for d, r in top:
              print(f"  do_compile {d:7.0f} s  {r}")
          PY

      # TODO: Upload build artifacts when ready
      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-artifacts-x86_64-${{ github.sha }}
      #     path: deploy/images/
      #     retention-days: 7

  # The ARM port's boot check: the same OS stack on the emulated
  # aarch64 machine, built and then booted to a login, alongside
  # x86_64 on every push and PR (and on dispatch by name), because a
  # change that only breaks the other architecture is exactly what
  # this job catches.  To make it blocking, add "Build qemuarm64" to
  # main's required status checks; until then it reports but does not
  # gate a merge.
  build-qemuarm64:
    name: Build qemuarm64
    needs: [version, build-container]
    if: >-
      !cancelled()
      && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.target == 'qemuarm64' || inputs.target == 'all')
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    env:
      KAS_WORK_DIR: ${{ github.workspace }}
    # A cold aarch64 image is a multi-hour build; the QA profile
    # (zstd, no scans) keeps the gate as light as it can be.
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Clean workspace (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          echo "Cleaned build/tmp directory"

      - name: Build
        run: mise run build --bsp qemuarm64 --ci --qa
        env:
          GITVERSION_INFO_VERSION: ${{ needs.version.outputs.informationalVersion }}
          GITVERSION_FULL_SEM_VER: ${{ needs.version.outputs.fullSemVer }}
          # No --icecc.  The classic icecc path preprocesses locally and
          # compiles the .i on the remote, which resurfaces -Werror
          # warnings the from-source build suppresses: the lost macro and
          # system-header context turns libgcc and gcc-runtime soft-fp
          # fall-through, libXt -Waddress, and an open-ended tail of
          # others into hard errors.  The cold cortexa57 tune compiles the
          # whole tree and hits them; x86_64 escapes only via warm sstate.
          # The gate proves the image builds and boots, so it takes the
          # deterministic local compiler and drops the farm dependency,
          # matching the hardware jobs.  hashserv still dedups sstate.
          LAMADIST_HASHSERVE: ${{ secrets.LAMADIST_HASHSERVE }}

      # Secure Boot on the aarch64 gate.  Enroll the project PK/KEK/db
      # into the container's AAVMF varstore (virt-fw-vars runs directly
      # here, since this job already executes inside the builder image),
      # then boot AAVMF -> systemd-boot -> signed UKI -> dm-verity root
      # -> login with Secure Boot enforcing, driven over the serial
      # console by the same smoke the x86_64 image passes locally.  The
      # smoke asserts SecureBoot=1 in-guest: firmware sets that variable
      # only when it enforced image verification on the UKI it launched.
      # The db certificate and the UKI signing key are the committed dev
      # keys, so this proves the mechanism, not key custody.  The pod has
      # no KVM, so it is pure TCG under the test task's 900 s budget.
      - name: Enroll Secure Boot vars
        run: mise run ovmf-vars --bsp qemuarm64 --ci

      - name: Boot smoke
        run: mise run test --bsp qemuarm64 --ci --secureboot

  build-rk1:
    name: Build RK1
    needs: [version, build-container]
    if: >-
      !cancelled()
      && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
      && github.event_name == 'workflow_dispatch'
      && (inputs.target == 'rk1' || inputs.target == 'all')
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    env:
      KAS_WORK_DIR: ${{ github.workspace }}
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Clean workspace (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          echo "Cleaned build/tmp directory"

      - name: Build
        run: mise run build --bsp rk1 --ci
        env:
          GITVERSION_INFO_VERSION: ${{ needs.version.outputs.informationalVersion }}
          GITVERSION_FULL_SEM_VER: ${{ needs.version.outputs.fullSemVer }}

  build-soquartz:
    name: Build SOQuartz
    needs: [version, build-container]
    if: >-
      !cancelled()
      && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
      && github.event_name == 'workflow_dispatch'
      && (inputs.target == 'soquartz' || inputs.target == 'all')
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    env:
      KAS_WORK_DIR: ${{ github.workspace }}
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Clean workspace (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          echo "Cleaned build/tmp directory"

      - name: Build
        run: mise run build --bsp soquartz --ci
        env:
          GITVERSION_INFO_VERSION: ${{ needs.version.outputs.informationalVersion }}
          GITVERSION_FULL_SEM_VER: ${{ needs.version.outputs.fullSemVer }}

  build-orin-nx:
    name: Build Orin NX
    needs: [version, build-container]
    if: >-
      !cancelled()
      && (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
      && github.event_name == 'workflow_dispatch'
      && (inputs.target == 'orin-nx' || inputs.target == 'all')
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    env:
      KAS_WORK_DIR: ${{ github.workspace }}
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Clean workspace (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf "${GITHUB_WORKSPACE}/build/tmp"
          echo "Cleaned build/tmp directory"

      - name: Build
        run: mise run build --bsp orin-nx --ci
        env:
          GITVERSION_INFO_VERSION: ${{ needs.version.outputs.informationalVersion }}
          GITVERSION_FULL_SEM_VER: ${{ needs.version.outputs.fullSemVer }}

  upload-artifacts:
    name: Upload Artifacts
    needs: build-x86-64
    runs-on: yocto-runner-set
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    timeout-minutes: 5
    steps:
      - name: Placeholder
        run: echo "TODO - Upload build artifacts"
