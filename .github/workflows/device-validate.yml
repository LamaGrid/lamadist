# SPDX-License-Identifier: Apache-2.0
---
# Run the live validation suite against the LamaDist test device from
# CI, on the one runner allowed to reach it.
#
# Contains no device details: host, port, user, the CI-only SSH key,
# and the pinned host key all come from the secret that the
# device-validate runner mounts at /run/secrets/device, so this file
# is safe in a public repository.  The host and user are masked so
# they never appear in run logs either.
#
# No pull_request or pull_request_target trigger, on purpose: nothing
# a fork or a PR can do reaches the device.  push to main and manual
# dispatch are the only triggers.  The concurrency group serializes
# runs at GitHub; the cluster Lease serializes against the lamadist
# head's deploys.  Both are needed.
#
# The push filter names the paths that change HOW the device is
# validated -- the suite, the validate task, the lease helper, the
# builder, and this file -- not the image sources.  A push does not
# update the device, so validating it after an image-source change
# would only re-check the image it already runs.  The device's image
# changes through an OTA the lamadist head drives, which dispatches a
# run (optionally pinning the deployed root hash) when it wants one.
#
# When no root hash is pinned (every push, and dispatches that omit
# it) the job validates whatever image the device runs now, reading
# that hash from the device first so rule 1 still records an identity.
name: Device validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/device-validate.yml'
      - '.mise/lib/validate/**'
      - '.mise/tasks/validate'
      - '.mise/lib/ci-device-lease.sh'
      - 'tests/validate/**'
      - 'container/**'
  workflow_dispatch:
    inputs:
      roothash:
        description: >-
          Expected root hash of the image under test.  Pin it to the
          image just deployed; when omitted (and on every push) the job
          reads the hash the device currently runs.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: lamadist-device
  cancel-in-progress: false

env:
  MISE_COLOR: 'false'

jobs:
  validate:
    name: Validate on device
    runs-on: device-validate
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    timeout-minutes: 30
    env:
      LEASE_HOLDER: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      # The key pair goes where the validate task looks for its test
      # key, so it generates none; the pinned host key is exported
      # through LAMADIST_VALIDATE_KNOWN_HOSTS, which the task honors.
      - name: Place the device credentials where the validate task expects them
        run: |
          set -o errexit
          umask 077
          key_dir="${GITHUB_WORKSPACE}/.local/share/lamadist/test-ssh"
          mkdir -p "${key_dir}" "${HOME}/.ssh"
          cp /run/secrets/device/ssh-key "${key_dir}/id_mldsa44-ed25519"
          cp /run/secrets/device/ssh-key.pub "${key_dir}/id_mldsa44-ed25519.pub"
          cp /run/secrets/device/ssh-known-hosts "${HOME}/.ssh/known_hosts"
          host="$(cat /run/secrets/device/device-host)"
          user="$(cat /run/secrets/device/device-user)"
          port="$(cat /run/secrets/device/device-port 2> /dev/null || echo 22)"
          # Mask the host only.  The user is not masked: it is the
          # unprivileged account name (a common word, a substring of the
          # product name), so masking it would garble ordinary log lines
          # while hiding nothing sensitive.
          echo "::add-mask::${host}"
          {
            echo "LAMADIST_VALIDATE_HOST=${host}"
            echo "LAMADIST_VALIDATE_PORT=${port}"
            echo "LAMADIST_VALIDATE_USER=${user}"
            echo "LAMADIST_VALIDATE_KNOWN_HOSTS=${HOME}/.ssh/known_hosts"
            # Run the device target through the one-call collector under
            # the forced-command key: from_env builds a CollectorTarget
            # and switches to strict host-key checking.
            echo "LAMADIST_VALIDATE_COLLECTOR=1"
          } >> "${GITHUB_ENV}"

      - name: Acquire the device lease
        run: >-
          mise x kubectl@latest jq@latest --
          ./.mise/lib/ci-device-lease.sh acquire "${LEASE_HOLDER}" 600

      # A push pins no root hash, so validate the image the device runs
      # now.  Read that hash through the SAME CollectorTarget the suite
      # uses -- one forced-command SSH call with the CI key, under the
      # held lease -- so the transport (post-quantum algorithms, the
      # strict host-key pin, keepalive, JSON and error handling) has a
      # single definition and cannot drift from the suite.  Fail closed
      # when it cannot be read; the always() release step still frees
      # the lease.
      #
      # On a push this makes rule 1 a RECORD, not a gate: the expected
      # hash is the device's own cmdline hash, so it cannot mismatch.  A
      # dispatch that pins inputs.roothash (the head, after an OTA) is
      # the path that turns rule 1 back into a real identity check.
      - name: Resolve the expected root hash
        env:
          ROOTHASH_INPUT: ${{ inputs.roothash }}
        run: |
          set -o errexit
          roothash="${ROOTHASH_INPUT}"
          if [ -z "${roothash}" ]; then
            lib="${GITHUB_WORKSPACE}/.mise/lib"
            key="${GITHUB_WORKSPACE}/.local/share/lamadist/test-ssh/id_mldsa44-ed25519"
            roothash="$(
              PYTHONPATH="${lib}" \
              LAMADIST_VALIDATE_TARGET=device \
              LAMADIST_VALIDATE_SSH_KEY="${key}" \
              python3 "${lib}/validate/print_device_roothash.py"
            )"
            if [ -z "${roothash}" ]; then
              echo "::error::could not read a root hash from the device collector"
              exit 1
            fi
          fi
          echo "ROOTHASH=${roothash}" >> "${GITHUB_ENV}"

      - name: Validate
        run: |
          set -o errexit
          mise run validate --target device --roothash "${ROOTHASH}"

      - name: Release the device lease
        if: always()
        run: >-
          mise x kubectl@latest jq@latest --
          ./.mise/lib/ci-device-lease.sh release "${LEASE_HOLDER}"
