# SPDX-License-Identifier: Apache-2.0
---
# Run the live validation suite against the LamaDist test device from
# CI, on the one runner allowed to reach it.
#
# Contains no device details: host, port, user, the CI-only SSH key,
# and the pinned host key all come from the secret that the
# device-validate runner mounts at /run/secrets/device, so this file
# is safe in a public repository.  The host and user are masked so
# they never appear in run logs either.
#
# No pull_request or pull_request_target trigger, on purpose: nothing
# a fork or a PR can do reaches the device.  The concurrency group
# serializes runs at GitHub; the cluster Lease serializes against the
# lamadist head's deploys.  Both are needed.
#
# Dispatch-only for now.  A push trigger merged ahead of its runner
# would queue a job that never starts, and a queued job never times
# out (timeout-minutes counts from job start).  The push-to-main
# trigger lands in the same change as the runner, the device secret,
# and the device-side entrypoint.
#
# Dispatched runs stay inert until the device side lands: the device
# does not yet authorize a CI key, so the suite's per-check SSH has
# nowhere to land, and the single device-side validate entrypoint the
# forced-command runs does not exist.  The validate task itself is
# ready for CI -- it accepts the LAMADIST_VALIDATE_* variables from the
# environment, honors the mounted known-hosts pin, and needs no sudo
# password (privileged checks run device-side under the forced-command
# wrapper).  One CI-side change lands with that entrypoint: the
# Validate step below still runs the suite's per-check SSH sessions,
# which a forced command answers with the entrypoint every time, so
# it becomes a single SSH call to the entrypoint (or the wrapper
# grows a verb allowlist; that choice is open).
name: Device validation

on:
  workflow_dispatch:
    inputs:
      roothash:
        description: >-
          Expected root hash of the image under test.  Read from the
          newest UKI in the deploy dir when omitted, which a fresh
          validate job does not have.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: lamadist-device
  cancel-in-progress: false

env:
  MISE_COLOR: 'false'

jobs:
  validate:
    name: Validate on device
    runs-on: device-validate
    container:
      image: registry.local/lamagrid/lamadist-builder:latest
    timeout-minutes: 30
    env:
      LEASE_HOLDER: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      # The key pair goes where the validate task looks for its test
      # key, so it generates none; the pinned host key is exported
      # through LAMADIST_VALIDATE_KNOWN_HOSTS, which the task honors.
      - name: Place the device credentials where the validate task expects them
        run: |
          set -o errexit
          umask 077
          key_dir="${GITHUB_WORKSPACE}/.local/share/lamadist/test-ssh"
          mkdir -p "${key_dir}" "${HOME}/.ssh"
          cp /run/secrets/device/ssh-key "${key_dir}/id_mldsa44-ed25519"
          cp /run/secrets/device/ssh-key.pub "${key_dir}/id_mldsa44-ed25519.pub"
          cp /run/secrets/device/ssh-known-hosts "${HOME}/.ssh/known_hosts"
          host="$(cat /run/secrets/device/device-host)"
          user="$(cat /run/secrets/device/device-user)"
          port="$(cat /run/secrets/device/device-port 2> /dev/null || echo 22)"
          # Mask the host only.  The user is not masked: it is the
          # unprivileged account name (a common word, a substring of the
          # product name), so masking it would garble ordinary log lines
          # while hiding nothing sensitive.
          echo "::add-mask::${host}"
          {
            echo "LAMADIST_VALIDATE_HOST=${host}"
            echo "LAMADIST_VALIDATE_PORT=${port}"
            echo "LAMADIST_VALIDATE_USER=${user}"
            echo "LAMADIST_VALIDATE_KNOWN_HOSTS=${HOME}/.ssh/known_hosts"
            # Run the device target through the one-call collector under
            # the forced-command key: from_env builds a CollectorTarget
            # and switches to strict host-key checking.
            echo "LAMADIST_VALIDATE_COLLECTOR=1"
          } >> "${GITHUB_ENV}"

      - name: Acquire the device lease
        run: >-
          mise x kubectl@latest jq@latest --
          ./.mise/lib/ci-device-lease.sh acquire "${LEASE_HOLDER}" 600

      - name: Validate
        env:
          ROOTHASH: ${{ inputs.roothash }}
        run: |
          set -o errexit
          if [ -n "${ROOTHASH}" ]; then
            mise run validate --target device --roothash "${ROOTHASH}"
          else
            mise run validate --target device
          fi

      - name: Release the device lease
        if: always()
        run: >-
          mise x kubectl@latest jq@latest --
          ./.mise/lib/ci-device-lease.sh release "${LEASE_HOLDER}"
